[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-agent-lite"
version = "0.0.1"
description = "Private agentic HSI research system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
